[project]
name = "sbem-voice"
version = "0.1.0"
description = "Wake-word activated Pipecat voice interface for SBEM through rosbridge"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pipecat-ai[cartesia,deepgram,local,openai,silero]==1.13.0",
    "websockets>=15,<18",
    "openwakeword==0.6.0",
    "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sbem-voice = "sbem_voice.cli:main"

[dependency-groups]
dev = ["ruff>=0.12.11,<1", "uvloop>=0.22,<1; sys_platform != 'win32'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
